modules:
  - type: signing

  - type: files
    files:
      - source: system
        destination: /

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
      google-fonts:
        - Noto Color Emoji

  # VS Code
  - type: rpm-ostree
    repos:
      - vscode.repo
    keys:
      - https://packages.microsoft.com/keys/microsoft.asc
    install:
      - code
  
  # 1Password
  - type: bling
    install:
        - 1password

  # Brave Browser
  - type: rpm-ostree
    repos:
      - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
    optfix:
      - brave.com
    install:
      - brave-browser

  # Cooler Control
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/codifryed/CoolerControl/repo/fedora-%OS_VERSION%/codifryed-CoolerControl-fedora-%OS_VERSION%.repo
    install:
      - coolercontrol
      - liquidctl

  # Gaming
  # Install Discover-Overlay via Flatpak instead
  - type: default-flatpaks
    notify: false 
    system:
      install:
        - io.github.trigg.discover_overlay

  # Misc
  - type: rpm-ostree
    install:
      - ulauncher
      - https://proton.me/download/mail/linux/ProtonMail-desktop-beta.rpm
      - https://github.com/rmcrackan/Libation/releases/download/v12.4.5/Libation.12.4.5-linux-chardonnay-amd64.rpm
      - zsh
      - syncthing
