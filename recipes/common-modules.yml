modules:
  - type: signing

  - type: files
    files:
      - source: system
        destination: /

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
      google-fonts:
        - Noto Color Emoji

  # 1Password
  - type: bling
    install:
        - 1password

  # Browsers
  - type: rpm-ostree
    repos:
      - https://repo.librewolf.net/librewolf.repo
    install:
      - librewolf

  # Cooler Control
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/codifryed/CoolerControl/repo/fedora-%OS_VERSION%/codifryed-CoolerControl-fedora-%OS_VERSION%.repo
    install:
      - coolercontrol
      - liquidctl

  # 3d-Printing Software
  - type: dnf
    copr:
      - serghei/freecad
    install:
      packages:
        - freecad

  # Gaming
  # Install Discover-Overlay via Flatpak instead
  - type: default-flatpaks
    configurations:
    - notify: false
      scope: system
      install:
        - io.github.trigg.discover_overlay

  # Misc
  - type: rpm-ostree
    install:
      - https://proton.me/download/mail/linux/ProtonMail-desktop-beta.rpm
      - syncthing
