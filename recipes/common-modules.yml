modules:
  - type: signing

  - type: files
    files:
      - source: system
        destination: /

  - type: os-release
    properties:
      NAME: CleavOS
      PRETTY_NAME: CleavOS

  - type: systemd
    system:
      enabled:
        - sendspin.service

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
      google-fonts:
        - Noto Color Emoji

  # Browsers
  - type: rpm-ostree
    repos:
      - https://repo.librewolf.net/librewolf.repo
      - https://copr.fedorainfracloud.org/coprs/sneexy/zen-browser/repo/fedora-%OS_VERSION%/sneexy-zen-browser-fedora-%OS_VERSION%.repo
    install:
      - librewolf
      - zen-browser

  # Cooler Control
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/codifryed/CoolerControl/repo/fedora-%OS_VERSION%/codifryed-CoolerControl-fedora-%OS_VERSION%.repo
    install:
      - coolercontrol
      - liquidctl

  # Gaming
  # Install Discover-Overlay via Flatpak instead
  - type: default-flatpaks
    configurations:
    - notify: false
      scope: system
      install:
        - io.github.trigg.discover_overlay

  # Dev Tools
  - type: rpm-ostree
    repos:
      - vscode.repo
      - https://copr.fedorainfracloud.org/coprs/scottames/ghostty/repo/fedora-%OS_VERSION%/scottames-ghostty-fedora-%OS_VERSION%.repo
    keys:
      - https://packages.microsoft.com/keys/microsoft.asc
    install:
      - code-insiders
      - ghostty

  # Misc
  - type: rpm-ostree
    install:
      - https://proton.me/download/mail/linux/ProtonMail-desktop-beta.rpm
      # renovate: datasource=custom.proton-pass depName=proton-pass versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-(?<build>\d+)\.x86_64$
      - https://proton.me/download/pass/linux/proton-pass-1.36.1-1.x86_64.rpm
      - https://github.com/timmo001/system-bridge/releases/download/5.4.4/system-bridge-5.4.4-1.x86_64.rpm
      - https://github.com/music-assistant/desktop-app/releases/download/0.3.6/Music.Assistant-0.3.6-1.x86_64.rpm
      - syncthing

  # SELinux
  - type: script
    scripts:
      - files/scripts/selinux-sendspin.sh
