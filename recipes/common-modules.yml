modules:
  - type: signing

  - type: files
    files:
      - source: system
        destination: /

  - type: os-release
    properties:
      NAME: CleavOS
      PRETTY_NAME: CleavOS

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
      google-fonts:
        - Noto Color Emoji

  # Cooler Control
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/codifryed/CoolerControl/repo/fedora-%OS_VERSION%/codifryed-CoolerControl-fedora-%OS_VERSION%.repo
    install:
      - coolercontrol
      - liquidctl

  # Preinstalled Flatpaks
  - type: default-flatpaks
    configurations:
    - notify: false
      scope: system
      install:
        - one.ablaze.floorp
        - io.github.trigg.discover_overlay
        - com.orcaslicer.OrcaSlicer
        - me.amankhanna.opendeck

  # Communication
  - type: rpm-ostree
    install:
      - https://discord.com/api/download?platform=linux&format=rpm

  # Dev Tools
  - type: rpm-ostree
    repos:
      - vscode.repo
      - https://copr.fedorainfracloud.org/coprs/scottames/ghostty/repo/fedora-%OS_VERSION%/scottames-ghostty-fedora-%OS_VERSION%.repo
      - https://download.docker.com/linux/fedora/docker-ce.repo
    keys:
      - https://packages.microsoft.com/keys/microsoft.asc
    install:
      - code
      - code-insiders
      - ghostty
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - podman
      - zsh

  - type: systemd
    system:
      enabled:
        - sendspin.service
        - docker.socket
        - podman.socket
        - cleav-docker-groups.service
        - OpenLinkHub.service
    user:
      enabled:
        - cleav-default-web-browser.service

  # Misc
  - type: rpm-ostree
    install:
      - https://github.com/jurkovic-nikola/OpenLinkHub/releases/download/0.9.1/OpenLinkHub-0.9.1-1.x86_64.rpm
      - https://persistent.oaistatic.com/codex-app-prod/linux/rpm/latest/chatgpt.x86_64.rpm
      - https://proton.me/download/mail/linux/ProtonMail-desktop-beta.rpm
      - https://github.com/stablyai/orca/releases/download/v1.4.200/orca-ide-1.4.200.x86_64.rpm
      # renovate: datasource=custom.proton-pass depName=proton-pass versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-(?<build>\d+)\.x86_64$
      - https://proton.me/download/pass/linux/proton-pass-1.40.2-1.x86_64.rpm
      - https://github.com/timmo001/system-bridge/releases/download/5.8.1/system-bridge-5.8.1-1.x86_64.rpm
      - autofs
      - syncthing
