modules:
  - type: signing

  - type: files
    files:
      - source: system/common
        destination: /

  - from-file: akmods-modules.yml

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode

  # Docker
  - type: rpm-ostree
    repos:
      - https://download.docker.com/linux/fedora/docker-ce.repo
    install:
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
      - docker-buildx-plugin
      - containerd.io

  # VS Code
  - type: rpm-ostree
    repos:
      - vscode.repo
    keys:
      - https://packages.microsoft.com/keys/microsoft.asc
    install:
      - code

  # 1Password
  - type: rpm-ostree
    repos:
      - 1password.repo
    keys:
      - https://downloads.1password.com/linux/keys/1password.asc
    optfix:
      - 1Password
    install:
      - 1password

  # Brave Browser
  - type: rpm-ostree
    repos:
      - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
    optfix:
      - brave.com
    install:
      - brave-browser

  # Cooler Control
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/codifryed/CoolerControl/repo/fedora-%OS_VERSION%/codifryed-CoolerControl-fedora-%OS_VERSION%.repo
    install:
      - coolercontrol
      - liquidctl

  # Misc
  - type: rpm-ostree
    install:
      - zsh
      - corectrl
      - ckb-next

  - type: systemd
    system:
      enabled:
        # Virtualization
        - libvirtd.service
        # Docker
        - docker.service
        - containerd.service
        - coolercontrold.service
