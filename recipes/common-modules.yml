modules:
  - type: signing

  - type: files
    files:
      - source: system
        destination: /

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
      google-fonts:
        - Noto Color Emoji

  # 1Password
  - type: bling
    install:
        - 1password

  # Browsers
  - type: rpm-ostree
    repos:
      - https://repo.librewolf.net/librewolf.repo
      - https://copr.fedorainfracloud.org/coprs/sneexy/zen-browser/repo/fedora-%OS_VERSION%/sneexy-zen-browser-fedora-%OS_VERSION%.repo
    install:
      - librewolf
      - zen-browser

  # Cooler Control
  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/codifryed/CoolerControl/repo/fedora-%OS_VERSION%/codifryed-CoolerControl-fedora-%OS_VERSION%.repo
    install:
      - coolercontrol
      - liquidctl

  # Gaming
  # Install Discover-Overlay via Flatpak instead
  - type: default-flatpaks
    configurations:
    - notify: false
      scope: system
      install:
        - io.github.trigg.discover_overlay

  # Dev Tools
  # VS Code
  - type: rpm-ostree
    repos:
      - vscode.repo
    keys:
      - https://packages.microsoft.com/keys/microsoft.asc
    install:
      - code-insiders

  # Misc
  - type: rpm-ostree
    install:
      - https://proton.me/download/mail/linux/ProtonMail-desktop-beta.rpm
      - https://github.com/timmo001/system-bridge/releases/download/5.4.0/system-bridge-5.4.0-1.x86_64.rpm 
      - syncthing
